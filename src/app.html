<!doctype html>
<html lang="bn" class="scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="canonical" href="https://busvarafinder.vercel.app" />

		<!-- Primary Meta Tags -->
		<meta name="author" content="Dhaka Bus Vara Community" />
		<meta
			name="keywords"
			content="dhaka bus vara, bus vara finder, busvarafinder, dhaka bus route, dhaka bus fare, brta bus fare, ঢাকা বাস ভাড়া, বাসের ভাড়া, বাস রুট, লোকাল বাস ভাড়া, ঢাকা বাস সার্ভিস"
		/>
		<meta name="robots" content="index, follow" />
		<meta name="theme-color" content="#047857" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://busvarafinder.vercel.app/" />
		<meta property="og:site_name" content="Dhaka Bus Vara (ঢাকা বাস ভাড়া)" />
		<meta property="og:image" content="https://busvarafinder.vercel.app/demo.webp" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:url" content="https://busvarafinder.vercel.app/" />
		<meta name="twitter:image" content="https://busvarafinder.vercel.app/demo.webp" />

		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased selection:bg-emerald-100 selection:text-emerald-900"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
